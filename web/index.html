<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMARTNAV - Dehradun</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="container">
    <header>
        <h1><i class="fas fa-route"></i> SMARTNAV Dehradun</h1>
    </header>

    <div class="search-panel">
        <div class="location-selectors">
            <div class="location-input">
                <label for="start"><i class="fas fa-map-marker-alt"></i> Start:</label>
                <select id="start">
                    <option value="ISBT">ISBT</option>
                    <option value="Clock Tower">Clock Tower</option>
                    <option value="Pacific Mall">Pacific Mall</option>
                    <option value="Forest Research Institute">Forest Research Institute</option>
                    <option value="Mussoorie Diversion">Mussoorie Diversion</option>
                    <option value="Rajpur Road">Rajpur Road</option>
                    <option value="Clementown">Clementown</option>
                    <option value="IMA">IMA</option>
                    <option value="Paltan Bazaar">Paltan Bazaar</option>
                    <option value="Railway Station">Railway Station</option>
                </select>
            </div>

            <div class="location-input">
                <label for="end"><i class="fas fa-flag-checkered"></i> Destination:</label>
                <select id="end">
                    <option value="ISBT">ISBT</option>
                    <option value="Clock Tower">Clock Tower</option>
                    <option value="Pacific Mall">Pacific Mall</option>
                    <option value="Forest Research Institute" selected>Forest Research Institute</option>
                    <option value="Mussoorie Diversion">Mussoorie Diversion</option>
                    <option value="Rajpur Road">Rajpur Road</option>
                    <option value="Clementown">Clementown</option>
                    <option value="IMA">IMA</option>
                    <option value="Paltan Bazaar">Paltan Bazaar</option>
                    <option value="Railway Station">Railway Station</option>
                </select>
            </div>

            <button id="findPathBtn" onclick="findPath()">
                <i class="fas fa-search"></i> Find Best Route
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="map-container">
            <div id="map">
                <!-- Map will be drawn here with SVG -->
            </div>
        </div>

        <div class="results-panel">
            <div class="results-header">
                <h2><i class="fas fa-info-circle"></i> Route Information</h2>
            </div>
            <div id="output" class="route-details">
                <p class="instruction">Select your start and destination points to find the best route.</p>
            </div>
            <div id="route-stats" class="route-stats">
                <!-- Stats will appear here -->
            </div>
        </div>
    </div>

    <footer>
        <p>SMARTNAV - Dehradun City Navigation System</p>
    </footer>
</div>

<script src="app.js"></script>
</body>
</html>
